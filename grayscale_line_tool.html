<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Grayscale Line Graph Tool</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 20px; background:#1e1e1e; color:#eee; }
  h1 { font-size: 18px; margin-bottom: 6px; }
  .hint { font-size:12px; color:#999; margin-top:0; }
  .canvases { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:16px; }
  .canvas-box { border:1px solid #555; background:#111; }
  .canvas-box p { margin:0; padding:4px 8px; font-size:11px; color:#888; border-bottom:1px solid #333; }
  canvas { display:block; max-width: 480px; height:auto; }
  #originalCanvas { cursor: crosshair; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:10px; }
  label { font-size:13px; display:flex; align-items:center; gap:6px; }
  input[type=number]{ width:80px; padding:3px; }
  button { padding:6px 14px; cursor:pointer; border:1px solid #555; background:#2a2a2a; color:#eee; border-radius:4px; }
  button:hover { background:#3a3a3a; }
  #status { font-size:13px; color:#9fdf9f; min-height:20px; white-space:pre-wrap; }
  #status.error { color:#ff8080; }
</style>
</head>
<body>
<h1>Grayscale Line Graph Tool</h1>
<p class="hint">캔버스에 이미지를 붙여넣기(Ctrl+V) 한 뒤, 왼쪽 캔버스에서 마우스로 드래그하여 X 범위(및 Y 중앙값)를 선택하세요. 선택하지 않으면 전체 가로폭을 사용합니다.</p>

<div class="canvases">
  <div class="canvas-box">
    <p>원본 이미지 (샘플링 소스)</p>
    <canvas id="originalCanvas" width="480" height="320"></canvas>
  </div>
  <div class="canvas-box">
    <p>Grayscale Line Graph</p>
    <canvas id="graphCanvas" width="480" height="320"></canvas>
  </div>
</div>

<div class="controls">
  <label>Y: <input type="number" id="yInput" min="0" value="0"></label>
  <label>cumulate line count: <input type="number" id="lineCountInput" min="1" value="10"></label>
  <button id="btnGrayscale">to 64 grayscale</button>
  <button id="btnCumulate">to cumulate</button>
  <button id="btnPasteJson">Paste Gray JSON</button>
</div>

<div id="status">이미지를 붙여넣어 주세요 (Ctrl+V)</div>

<script src="./grayscale_line_tool.js"></script>
</body>
</html>
